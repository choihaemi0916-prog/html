
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Height Chart</title>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
    <div id="app">
        <div id="chart"></div>
    </div>

    <script>
      const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)

            };
        },
        methods: {
            // 함수(메소드) - (key : function())

            fnChart : function () {
                let self = this;
                $.ajax({
                    url: "http://192.168.30.57:3000/student",
                    dataType: "json",
                    type: "GET",
                    data: {},
                    success: function (data) {
                        let dataList = [];
                        let nameList = [];
                        for(let i=0; i<data.list.length; i++){
                            dataList.push(data.list[i].STU_HEIGHT);
                            nameList.push(data.list[i].STU_NAME);
                        }

                        var options = {
                        series: [
                            {
                                name: '키',
                                data: dataList,
                            },
                        ],
                        chart: {
                            height: 350,
                            type: 'bar',
                        },
                        plotOptions: {
                            bar: {
                            borderRadius: 10,
                            dataLabels: {
                                position: 'top', // top, center, bottom
                            },
                            },
                        },
                        dataLabels: {
                            enabled: true,
                            formatter: function (val) {
                            return val + 'cm'
                            },
                            offsetY: -20,
                            style: {
                            fontSize: '12px',
                            colors: ['#304758'],
                            },
                        },

                        xaxis: {
                            categories: nameList,
                            position: 'top',
                            axisBorder: {
                            show: false,
                            },
                            axisTicks: {
                            show: false,
                            },
                            crosshairs: {
                            fill: {
                                type: 'gradient',
                                gradient: {
                                colorFrom: '#D8E3F0',
                                colorTo: '#BED1E6',
                                stops: [0, 100],
                                opacityFrom: 0.4,
                                opacityTo: 0.5,
                                },
                            },
                            },
                            tooltip: {
                            enabled: true,
                            },
                        },
                        yaxis: {
                            axisBorder: {
                            show: false,
                            },
                            axisTicks: {
                            show: false,
                            },
                            labels: {
                            show: false,
                            formatter: function (val) {
                                return val + 'cm'
                            },
                            },
                        },
                        title: {
                            text: '학생별 키 비교',
                            floating: true,
                            offsetY: 330,
                            align: 'center',
                            style: {
                            color: '#444',
                            },
                        },
                        }

                        self.chart = new ApexCharts(document.querySelector('#chart'), options)
                        self.chart.render()
                        
                    }
                });
            }

            
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
            let self = this;
            self.fnChart();
        }
    });

    app.mount('#app');
    </script>
</body>
</html>
