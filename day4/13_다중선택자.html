<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Document</title> 
</head> 
<body> 
    <div class="subject">자바</div> 
    <div class="subject">오라클</div> 
    <div class="subject">HTML</div> 
    <div> 
        <button onclick="fnTest()">클릭!</button> 
    </div> 

    <script> 
        function fnTest(){ 
            let obj = document.querySelectorAll(".subject"); 
            console.log(obj); 
            for(let i=0; i<obj.length; i++){ 
                let r = Math.floor(Math.random()*256); 
                let g = Math.floor(Math.random()*256); 
                let b = Math.floor(Math.random()*256); 
                // 수정됨: 콤마(,) -> 마침표(.)
                obj[i].style.color = `rgb(${r}, ${g}, ${b})`; 
            } 
        } 
    </script>
</body> 
</html>
