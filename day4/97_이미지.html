<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label><input type="checkbox" name="subject" value="java">자바</label>
    <label><input type="checkbox" name="subject" value="oracle">oracle</label>
    <label><input type="checkbox" name="subject" value="html">html</label>
    <label><input type="checkbox" name="subject" value="jquery">jquery</label>
    <button onclick="fnTest()">클릭!</button>
    <hr>
    <div id="imageList">

    </div>
</body>
</html>
<script>
    function fnTest(){
        let subject = document.querySelectorAll("input[name='subject']:checked");
        let imageList = document.querySelector("#imageList");
        // image.src = `../images/${subject}.jpg`;
        for(let i=0; i<subject.length; i++){
            imageList.innerHTML += `<img src='../images/${subject[i].value}.jpg'>`;
        }
    }
</script>
