<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <title>Document</title>
  
    <style>
        table, tr, td, th{
            border: 2px solid black; /* 2픽셀 크기의 검은색 선(solid) */
            border-collapse: collapse; /* 겹치는 선 하나로 */
            padding: 5px 20px; /* 상하 5px, 좌우 20ox 여백 */
            text-align: center; /* 가운데 정렬 */
        }
        th {
            background-color: beige;
        }
    </style>
</head>
<body>
  <div id="contents"></div>

  <script>
    $.ajax({
      url: "https://jsonplaceholder.typicode.com/users",
      dataType: "json",
      type: "GET",
      success: function(data) {
        console.log(data);
        let contents = document.querySelector("#contents");
        let table = document.createElement("table");
        let tr = document.createElement("tr");
        tr.innerHTML = "<th>아이디</th>" + "<th>이름</th>" + "<th>이메일</th>" + "<th>웹사이트</th>"
        table.appendChild(tr);
        for(let i=0; i<data.length; i++){
            let user = document.createElement("tr");
            user.innerHTML = `<td>${data[i].id}</td>` + `<td>${data[i].name}</td>` + `<td>${data[i].email}</td>` + `<td>${data[i].website}</td>`
            table.appendChild(user);
        }
        contents.appendChild(table);
      }
    });
  </script>
</body>
</html>
