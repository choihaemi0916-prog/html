<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑몰</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f2f5;
      color: #333;
    }

    .box {
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px #eee;
      font-weight: bold;
      font-size: 20px;
    }
    #container {
      display: grid;
      gap: 20px;    
      grid-template-columns: 250px 1fr; 
      grid-template-rows: 150px minmax(500px, auto) 150px;
      grid-template-areas:
        "header header"
        "side contents" 
        "footer footer";
    }
    #header {
      color: white;
      grid-area: header; 
    }
    .header {
        display: grid;
        grid-template-columns: repeat(3, auto); /* 3개의 열 생성 */
        justify-content: space-between;         /* 왼쪽 끝, 중간, 오른쪽 끝 분산 배치 */
    }    
    .logo img {
        width: 200px;
    }
    .search-container {
        width: 300px;
        margin: 20px auto;
    }

    .search-container form {
        display: flex;
        align-items: center;
        border: 1px solid #ccc;
        border-radius: 8px;
        overflow: hidden;
        padding: 4px;
        background-color: #fff;
    }

    .search-container input[type="text"] {
        flex: 1;
        border: none;
        outline: none;
        padding: 8px 10px;
        font-size: 14px;
    }

    .search-container button {
        border: none;
        background-color: #00c73c;
        color: #fff;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
    }

    .search-container button:hover {
        background-color: #00b034;
    }

    #side {
      background-color: white;
      color: black;
      grid-area: side;
    }
    .category {
        padding: 15px;
    }    

    .category a {
        color: #333333;
        text-decoration: none; /* 밑줄 제거 */
        font-weight: 500;
        transition: color 0.2s ease-in-out;
    }
    .category li:hover{
        border-radius: 5px;
        background-color: #45b7d1;
    }
    .category a:hover {
        color: white; /* 마우스 올렸을 때 색상 변경 */
        font-weight: bold;
    }

    .category ul {
        list-style: none; /* 기본 점(bullet) 제거 */
        padding-left: 0;
    }

    .category li{
        padding: 5px;
        margin-top: 5px;
        background-color: white;
    }
    .category h4 {
        color: black;
    }
    .category2 {
        font-size: 15px;
    }
    .category2 ul {
        list-style: none;
    }

    #contents {
      box-shadow: none;
      padding: 20px;
      grid-area: contents;
    }    

    #footer {
      background-color: #45b7d1;
      color: white;
      grid-area: footer;
    }
    
    #contents{
	    display: grid;
	    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));  
        grid-auto-rows: 150px;
        gap:20px
    }
    .widget { 
        background-color: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 3px 3px 3px #7e7d7d;
        height: 350px;
    }
    .widget img {
        width: 100%;
    }
    .word {
        margin-top: 15px;
    }

    /* 크기 작아졌을 때 처리 */
    @media (max-width: 768px) {

        #container {
        display: grid;
        gap: 20px;    
        grid-template-columns: 1fr; 
        grid-template-rows: 150px 150px minmax(500px, auto) 150px;
        grid-template-areas:
            "header"
            "side" 
            "contents"
            "footer";
        }

    }
  </style>
</head>

<body>

  <div id="container">
    <div class="box" id="header">
        <div class="header">
            <div class="logo"><img src="../images/네이버 AI-18.png"></div>
            <div>
                <div class="search-container">
                <form action="#" method="GET">
                    <input type="text" name="q" placeholder="검색어를 입력하세요..." required>
                    <button type="submit">검색</button>
                </form>
                </div>                
            </div>
            <div>로그인</div>
        </div>
    </div>
    <div class="box" id="side">
        <div class="category">
            <ul>
                <h4>카테고리</h4>
                <li><a href="#">전체 상품</a></li>
                <li><a href="#">쌀</a></li>
                <li><a href="#">만두</a></li>
                <li><a href="#">새우</a></li>
                <li><a href="#">볶음밥</a></li>
            </ul>
        </div>
        <div class="category2">
            <ul>
                <li><h4>가격대</h4></li>
                <li><input type="checkbox">1만원 이하</li>
                <li><input type="checkbox">1만원~3만원</li>
                <li><input type="checkbox">3만원~5만원</li>
                <li><input type="checkbox">5만원 이상</li>
            </ul>
        </div>
    </div>
    <div class="box" id="contents">
      <div class="widget">
        <img src="../images/img1.jpg">
        한섬만두<div class="word">15,900원</div>
      </div>
      <div class="widget">
        <img src="../images/img2.jpg">이맛쌀
        <div class="word">15,900원</div>
      </div>
      <div class="widget">
        <img src="../images/img3.jpg">경기미<div class="word">15,900원</div>
      </div>
      <div class="widget">
        <img src="../images/img1.jpg">새우<div class="word">15,900원</div>
      </div>
      <div class="widget">
        <img src="../images/img2.jpg">볶음밥<div class="word">15,900원</div>
      </div>
    </div>
    <div class="box" id="footer">하단영역</div>
  </div>
</body>
</html>
