<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바 수강생 모집</title>
    <style>
        #container {
            width: 1200px;
            margin: 20px auto;
            text-align: center;
            background-color: rgba(76, 175, 80, 1.00);
            padding: 5px;
        }
        #container h1,h3 {
            color: white;
        }
        #container2 {
            width: 1160px;
            margin: 30px auto;
            padding: 20px;
            box-shadow: 3px 3px 10px rgb(204, 204, 204);
            border-radius: 10px;
        }
        #container2 text1{
            font-size: 30px;
            font-weight: 100;
        }
        #container2 
        table, tr, td, th{
            border: 1px solid rgb(235, 235, 235); /* 2픽셀 크기의 검은색 선(solid) */
            border-collapse: collapse; /* 겹치는 선 하나로 */
            padding: 10px 20px; /* 상하 5px, 좌우 20ox 여백 */
        }
        .width {
            width: 1000px;
        }
        .gray {
            background-color: #f1f1f1;
            font-weight: 700;
            width: 120px;
            text-align: center;
        }
        .center {
            text-align: center;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div>
            <h1>자바 수강생 모집</h1>
            <h3>자바에 관심 있는 새내기 여러분을 모집합니다.</h3>
        </div>
    </div>
    <div id="container2">
        <div class="text1">
        <strong>교내 프로그래밍 동아리에서 <span style="color: blue;">신입생</span>을 대상으로 자바 수강생을 모집합니다.<br>
        <span style="color: red;">학부나 전공에 상관없습니다.</span><br>
        평소 방송에 관심있었던 여러 학우들의 지원바랍니다.
        </strong>
        </div>
    <br>
    <div>
        <table>
            <tr>
                <td class="gray">모집 기간</td>
                <td class="width">2월 5일 ~ 2월 11일</td>
            </tr>
            <tr>
                <td class="gray">모집 분야</td>
                <td class="width">자바 기초, 자바 심화, 백엔드 입문</td>
            </tr>
            <tr>
                <td class="gray">지원 방법</td>
                <td class="width">양식 작성 후 이메일 접수<br>
                <i>지원서 양식은 교내 동아리 홈페이지 공지 게시판에 있습니다.</i></td>
            </tr>
        </table>            
    </div>
        <br>
        <div>
            <strong>혜택</strong>
            <ul>
                <li>아주 작은 소정의 활동비 지급</li>
                <li>주기적인 회식</li>
            </ul>
        </div>
        <div class="center">
            <img src="../images/java_img.jpg" width="250" height="400">
        </div>
    </div>
</body>
</html>
