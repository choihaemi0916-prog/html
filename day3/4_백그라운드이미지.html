<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백그라운드이미지</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            border: 2px solid black;
            background-image: url(../images/8.jpg);
            /* background-size: 300px 300px; */
            background-size: contain;
            /* contain : 이미지가 잘리지 않게 최대한 비율을 유지하면서 크기를 맞춘다*/
            /* 박스가 이미지보다 클 경우 빈공간이 생길 수 있다. */
            /* cover : 가로, 세로를 모두 채우는게 목적 */
            /* 비율을 유지하고, 이미지가 잘릴 수 있다 */
            /* 빈공간은 생기지 않는다. */
            border-radius: 50%;
        }

        .box:hover {
            background-image: url(../images/3.jpg);
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
