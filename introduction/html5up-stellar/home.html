<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최혜미의 홈페이지</title>
    <style>
        .img-box img {
            width: 100%;
            height: 100%;
        }
        
        .img-hover {
            display: none;
        }

        .img-box:hover .img {
            display: none;
        }
        .img-box:hover .img-hover {
            display: block;
        }
    </style>
</head>
<body>
    <div class="img-box">
        <div class="img">
            <a href="../html5up-stellar/index.html"><img src="../images/01.png"></a>
        </div>
        <div class="img-hover">
            <a href="../html5up-stellar/index.html"><img src="../images/02.png"></a>
        </div>
    </div>
</body>
</html>
